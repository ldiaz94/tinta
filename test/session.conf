<!-- test/session.conf: the session bus live.cn runs on, by
     dbus-run-session. Unlike the system's own session.conf it names no
     service directories, so that tinta's Notify starts no notification
     server installed on the machine (mako, say): the call is refused,
     and dbus-monitor sees it all the same. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
